<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChartMaker</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="toolbar">
  <h1><img src="/logo.png" alt="ChartMaker" width="380" height="72"></h1>
  <button id="btn-new" title="空の作戦を作る">新規</button>
  <label class="btn">txtを開く<input id="file-open" type="file" accept=".txt,text/plain" hidden></label>
  <span class="sep"></span>
  <button id="btn-undo" title="元に戻す (Ctrl+Z)">↶ 元に戻す</button>
  <button id="btn-redo" title="やり直す (Ctrl+Y)">↷ やり直す</button>
  <span class="sep"></span>
  <label>倍率
    <select id="zoom">
      <option value="0.15">小</option>
      <option value="0.25">中</option>
      <option value="0.4">大</option>
      <option value="0.7">特大</option>
    </select>
  </label>
  <span class="sep"></span>
  <span id="summary"></span>
  <span class="grow"></span>
  <a id="support-link" class="btn support" hidden target="_blank" rel="noopener" title="ChartMaker の開発とサーバー代を支援する（外部サイト）">♡ 開発を支援</a>
  <button id="btn-share" title="今の作戦を開ける URL をコピーする">共有URL</button>
  <button id="btn-tracker" title="この作戦で進行管理を始める（別タブ）">進行管理 β</button>
  <button id="btn-render" class="primary">画像生成</button>
</header>

<div id="status" hidden></div>

<main>
  <section id="timeline-wrap">
    <div id="timeline"></div>
  </section>

  <div id="splitter" role="separator" aria-orientation="vertical" tabindex="0"
       title="ドラッグで幅を変更（ダブルクリックで元に戻す）"></div>

  <aside id="side">
    <nav class="tabs">
      <button data-tab="select" class="active">選択</button>
      <button data-tab="settings">設定</button>
      <button data-tab="text">テキスト</button>
    </nav>
    <div class="panel" id="panel-select"></div>
    <div class="panel" id="panel-settings" hidden></div>
    <div class="panel" id="panel-text" hidden>
      <p class="hint">GUIの内容から生成された txt です。直接書き換えて「テキストを反映」でGUIに取り込めます。</p>
      <textarea id="text" spellcheck="false"></textarea>
      <div class="row">
        <button id="btn-apply-text" disabled>テキストを反映</button>
        <button id="btn-copy">コピー</button>
        <button id="btn-save-text">.txt 保存</button>
      </div>
    </div>
  </aside>
</main>

<div id="modal" hidden>
  <div class="modal-box">
    <div class="row">
      <a id="download-png" class="btn primary" download="chart.png">PNG をダウンロード</a>
      <span class="grow"></span>
      <button id="btn-close-modal">閉じる</button>
    </div>
    <div class="modal-img"><img id="preview" alt="生成画像"></div>
  </div>
</div>

<script src="/static/common.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
